# .NET counterpart: .github/workflows/ci.yml in readlog-dotnet, which restores,
# builds and runs the xUnit suite. Same job, different toolchain: composer install
# instead of dotnet restore, Pest instead of `dotnet test`, and an explicit
# `migrate` step because Laravel has no compile stage that would catch a broken
# migration.
#
# Three jobs. `sqlite` is the developer's loop, exactly what `vendor/bin/pest` does
# on a laptop, plus the documentation drift check. `postgres` is the production
# claim: the whole migrate, seed and test cycle against a stock postgres:16 service
# container, configured through nothing but the six DB_* variables documented in
# .env.example. If that job is green, the app comes up on any standard Postgres,
# not on one provider's flavour of it. `compose` is the "fresh clone to running
# app" claim, checked from a bare checkout.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, fileinfo, curl, dom, xml, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations against a clean database
        run: |
          touch database/database.sqlite
          php artisan migrate --force --seed

      - name: The gate
        # `composer verify` is what AGENTS.md tells every contributor and every
        # agent is the definition of done, so CI runs that command rather than an
        # open-coded copy of its four steps (pint, phpstan level 6, pest,
        # readlog:docs-check). If the two could drift, the instruction would
        # eventually be wrong.
        run: composer verify

      - name: Run the suite again for its JUnit output
        # Only for the count comparison below, which needs the XML. Everything
        # this asserts about pass or fail was already decided by the gate above.
        run: vendor/bin/pest --log-junit /tmp/junit.xml

      - name: The documented test counts are the real ones
        # docs-check deliberately does not run the suite: a suite that counts itself
        # proves nothing. This step closes that loop from outside, against the run
        # that just happened.
        run: |
          # PHPUnit puts the totals on the first <testsuite> child, not on the
          # attribute-less <testsuites> root. Reading the root yields None, which
          # would fail this step unconditionally against every run.
          totals='import xml.etree.ElementTree as E,sys; r=E.parse("/tmp/junit.xml").getroot(); s=r if r.get("tests") else r[0]; print(s.get(sys.argv[1]))'
          cases=$(python3 -c "$totals" tests)
          assertions=$(python3 -c "$totals" assertions)
          recorded_cases=$(python3 -c "import json;print(json.load(open('docs/machine/test-counts.json'))['cases'])")
          recorded_assertions=$(python3 -c "import json;print(json.load(open('docs/machine/test-counts.json'))['assertions'])")
          echo "ran cases=$cases assertions=$assertions; recorded cases=$recorded_cases assertions=$recorded_assertions"
          if [ "$cases" != "$recorded_cases" ]; then
            echo "docs/machine/test-counts.json is stale. Update it and any prose quoting these numbers." >&2
            exit 1
          fi
          # Assertions are reported, not enforced: several tests iterate over the
          # documentation itself, so the total moves when a doc is added or a table
          # row changes, which is not drift worth failing a build over.
          if [ "$assertions" != "$recorded_assertions" ]; then
            echo "note: assertion total moved from $recorded_assertions to $assertions"
          fi

      - name: Generate the static snapshot end to end
        # The tests fake the cover downloads; this run does not, so it also proves
        # the crawl and the real provider images still fit together.
        run: |
          php artisan readlog:snapshot --out=/tmp/snapshot
          test -f /tmp/snapshot/index.html
          test -f /tmp/snapshot/library/list/index.html
          test "$(find /tmp/snapshot/book -name index.html | wc -l)" = "12"
          test "$(find /tmp/snapshot/assets/covers -type f | wc -l)" = "12"
          ! grep -rl "http://localhost" /tmp/snapshot

  postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Stock image, no extensions, no provider. Anything that only works on a
        # particular managed Postgres will fail here.
        image: postgres:16
        env:
          POSTGRES_DB: readlog
          POSTGRES_USER: readlog
          POSTGRES_PASSWORD: readlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readlog -d readlog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The documented variables, and only those. The container has no TLS, so
      # sslmode is "disable" here; a managed provider will want "require", which is
      # the whole reason it is a variable.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: readlog
      DB_USERNAME: readlog
      DB_PASSWORD: readlog
      DB_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # pdo_sqlite is here even though this job runs on Postgres: composer.json
          # requires it (SQLite is the app's default connection), so composer install
          # would refuse without it.
          extensions: pdo_pgsql, pgsql, pdo_sqlite, mbstring, fileinfo, curl, dom, xml, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate a clean Postgres database
        run: php artisan migrate --force

      - name: Seed the demo library
        run: php artisan db:seed --force

      - name: Seed again, which must be a no-op
        run: |
          php artisan db:seed --force
          php artisan tinker --execute='
            $books = App\Models\Book::count(); $entries = App\Models\ReadEntry::count();
            echo "books=$books entries=$entries", PHP_EOL;
            if ($books !== 12 || $entries !== 14) { fwrite(STDERR, "seeding is not idempotent on Postgres\n"); exit(1); }
          '

      - name: Confirm no migration is pending
        # --pending=1 makes the command exit with status 1 if anything is pending.
        run: php artisan migrate:status --pending=1

      - name: Run the test suite against Postgres
        # phpunit.xml sets DB_CONNECTION=sqlite for the local loop, but PHPUnit does
        # not override variables that already exist in the process environment, so
        # the DB_* values above win and the whole suite runs on the container.
        run: vendor/bin/pest

  compose:
    # The "fresh clone to running app" claim, checked the way a reader would do it:
    # a bare checkout with no .env, one command, and the health route answering.
    # Then the same with the Postgres override, and a look inside to prove the
    # rows are really in Postgres and not in a stray SQLite file.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start with SQLite (the default)
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Health route and home page answer
        run: |
          curl -fsS http://127.0.0.1:8080/up > /dev/null
          curl -fsS http://127.0.0.1:8080/ | grep -q "Recently Read"
          docker compose exec -T app php artisan tinker --execute='
            echo DB::connection()->getDriverName(), " books=", App\Models\Book::count(), PHP_EOL;
            if (DB::connection()->getDriverName() !== "sqlite" || App\Models\Book::count() < 1) exit(1);'

      - name: Behind a tunnel, links are https and the session cookie is Secure
        # cloudflared terminates TLS and forwards plain HTTP with these headers.
        # nginx passes them to php-fpm and TRUSTED_PROXIES=* makes the app believe
        # them. This is the tunnel minus Cloudflare, which CI cannot open.
        run: |
          curl -fsS -D headers.txt -o page.html             -H "Host: demo.trycloudflare.com" -H "X-Forwarded-Proto: https" -H "X-Forwarded-For: 203.0.113.9"             http://127.0.0.1:8080/
          grep -q 'href="https://demo.trycloudflare.com/library"' page.html
          ! grep -q 'http://localhost' page.html
          grep -i '^set-cookie: readlog-session=' headers.txt | grep -qi 'secure'
          docker compose exec -T app php artisan readlog:smoke

      - name: A second start migrates nothing and seeds nothing
        run: |
          docker compose restart app
          sleep 5
          docker compose logs --since 60s app | grep -q "already populated"

      - name: Stop
        run: docker compose down

      - name: Start with the Postgres override
        run: docker compose -f compose.yaml -f compose.postgres.yaml up -d --wait --wait-timeout 180

      - name: The app is on Postgres and the data is there
        run: |
          curl -fsS http://127.0.0.1:8080/up > /dev/null
          curl -fsS "http://127.0.0.1:8080/library?q=dune" | grep -q "Yes! Found"
          docker compose -f compose.yaml -f compose.postgres.yaml exec -T app php artisan tinker --execute='
            if (DB::connection()->getDriverName() !== "pgsql") exit(1);'
          test "$(docker compose -f compose.yaml -f compose.postgres.yaml exec -T db psql -U readlog -d readlog -tAc "select count(*) from books;")" = "12"

      - name: Tear down
        if: always()
        run: docker compose -f compose.yaml -f compose.postgres.yaml down -v
