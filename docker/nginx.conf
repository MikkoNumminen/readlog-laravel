# Nginx in front of PHP-FPM. Static files are served straight from public/, which
# is bind-mounted read-only from the checkout; everything else goes to index.php
# over FastCGI. This is the standard Laravel layout, and it is what the "small web
# server" in the brief refers to: nginx does the HTTP, PHP-FPM does the PHP.
#
# .NET counterpart: none needed. Kestrel is both the web server and the runtime,
# which is one of the places .NET is simpler.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Both nginx and the app container mount the app at the same path, so the
    # SCRIPT_FILENAME nginx computes is valid inside the app container.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # The health probe used by compose and by the smoke check. Kept off the access
    # log so a healthcheck every few seconds does not drown the real traffic.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only forward PHP files nginx can see itself. Without this, any *.php path
        # goes to FPM regardless, and FPM will execute whatever exists at that path
        # in the app container. public/ holds only index.php, so today the
        # difference is a 404 from nginx instead of "File not found." from FPM,
        # but the rule should not depend on that staying true.
        try_files $uri =404;

        fastcgi_pass app:9000;
        # "Ask your library" waits on a local model: the app bounds that at 60 s
        # to embed and 90 s to answer (config/services.php), and degrades with a
        # notice when a bound is hit. nginx's default 60 s would turn the slow
        # first question after a start into a bare 504 before the app could say
        # anything, so give it room to finish or fail on its own terms.
        fastcgi_read_timeout 240s;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing under a dot-directory is ever served, except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
