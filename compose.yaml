# One command from a fresh clone to a running, seeded app:
#
#     docker compose up --build
#
# then open http://localhost:8080. Nothing else is needed: no PHP on the host, no
# .env file, no key to paste. The first start generates an APP_KEY, migrates,
# seeds the demo library and caches config; every later start finds all of that
# already done in the storage volume.
#
# Two services. `app` is PHP-FPM with the code baked into the image (Dockerfile);
# `web` is nginx serving public/ and forwarding everything else to `app` over
# FastCGI. SQLite is the database by default and lives in the storage volume. To
# run against Postgres instead, add the override file:
#
#     docker compose -f compose.yaml -f compose.postgres.yaml up --build
#
# To put the running app on a temporary public URL (a demo, an interview), add the
# tunnel profile. It runs Cloudflare's cloudflared in quick-tunnel mode, which
# needs no Cloudflare account, and prints the https://....trycloudflare.com URL:
#
#     docker compose --profile tunnel up tunnel        # Ctrl-C closes it
#
# scripts/tunnel-up.sh and scripts/tunnel-down.sh wrap that and print only the
# URL. DEMO.md is the five-minute version of all of this.
#
# Optional settings are read from the shell or from a .env file next to this
# file: APP_PORT (default 8080), GOOGLE_BOOKS_API_KEY (default unset),
# CLOUDFLARE_TUNNEL_TOKEN (only for the named-tunnel profile).

name: readlog

services:
  app:
    build: .
    image: readlog-laravel/app
    restart: unless-stopped
    environment:
      APP_NAME: ReadLog
      APP_ENV: production
      APP_DEBUG: "false"
      # What the app believes its own address is when it generates a URL outside a
      # request (artisan commands, the smoke check). Inside a request the request's
      # own host and scheme are used, which is what makes a tunnel work.
      APP_URL: http://localhost:${APP_PORT:-8080}
      # The app only ever sees nginx, and nginx only ever sees the browser or the
      # tunnel. Trusting the caller is what makes X-Forwarded-Proto: https from
      # cloudflared turn into https links and a Secure session cookie. See
      # config/trustedproxy.php.
      TRUSTED_PROXIES: "*"
      # Everything the app writes goes to stderr, so `docker compose logs app` is
      # the log. Nothing is written to storage/logs.
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/readlog.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      BOOK_SEARCH_LIVE_TESTS: "false"
    volumes:
      # Named, not bind-mounted: the SQLite file, sessions and the view cache must
      # persist across `docker compose down` and must be owned by the container's
      # www-data user, which a bind mount from a Windows or macOS host cannot
      # promise. First use copies the image's storage/ into the volume.
      - storage:/var/www/html/storage
    healthcheck:
      # php-fpm has no HTTP endpoint of its own; the meaningful check is nginx's.
      # This one only confirms the FPM master is alive so `web` can wait for it.
      # FPM rewrites its process title, so match on that rather than the binary name.
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master' > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx needs the static files in public/ at the same path the app container
      # has them, so SCRIPT_FILENAME lines up. Read-only: nothing writes there.
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The health route Laravel ships. Same URL the smoke check hits.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # --- On-demand public exposure. Both are profiles, so a plain `up` never starts
  # them; nothing leaves the machine unless asked. ---------------------------------

  tunnel:
    # Quick tunnel: no account, no DNS, a random *.trycloudflare.com hostname that
    # lives as long as this container does. Cloudflare terminates TLS and forwards
    # to nginx over the compose network with X-Forwarded-Proto: https.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      web:
        condition: service_healthy
    restart: "no"

  tunnel-named:
    # Named tunnel: a stable hostname on a domain you control, through a free
    # Cloudflare account. The token comes from the Zero Trust dashboard, and the
    # hostname-to-service mapping (public hostname -> http://web:80) is configured
    # there too, which is why there is no --url here. See DEMO.md.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel-named"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  storage:
