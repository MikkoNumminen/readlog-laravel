# One command from a fresh clone to a running, seeded app:
#
#     docker compose up --build
#
# then open http://localhost:8080. Nothing else is needed: no PHP on the host, no
# .env file, no key to paste. The first start generates an APP_KEY, migrates,
# seeds the demo library and caches config; every later start finds all of that
# already done in the storage volume.
#
# Two services. `app` is PHP-FPM with the code baked into the image (Dockerfile);
# `web` is nginx serving public/ and forwarding everything else to `app` over
# FastCGI. SQLite is the database by default and lives in the storage volume. To
# run against Postgres instead, add the override file:
#
#     docker compose -f compose.yaml -f compose.postgres.yaml up --build
#
# Optional settings are read from the shell or from a .env file next to this
# file: APP_PORT (default 8080), GOOGLE_BOOKS_API_KEY (default unset).

name: readlog

services:
  app:
    build: .
    image: readlog-laravel/app
    restart: unless-stopped
    environment:
      APP_NAME: ReadLog
      APP_ENV: production
      APP_DEBUG: "false"
      # What the app believes its own address is when it generates a URL outside a
      # request (artisan commands, the smoke check). Inside a request the request's
      # own host and scheme are used, which is what makes a tunnel work.
      APP_URL: http://localhost:${APP_PORT:-8080}
      # Everything the app writes goes to stderr, so `docker compose logs app` is
      # the log. Nothing is written to storage/logs.
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/readlog.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      BOOK_SEARCH_LIVE_TESTS: "false"
    volumes:
      # Named, not bind-mounted: the SQLite file, sessions and the view cache must
      # persist across `docker compose down` and must be owned by the container's
      # www-data user, which a bind mount from a Windows or macOS host cannot
      # promise. First use copies the image's storage/ into the volume.
      - storage:/var/www/html/storage
    healthcheck:
      # php-fpm has no HTTP endpoint of its own; the meaningful check is nginx's.
      # This one only confirms the FPM master is alive so `web` can wait for it.
      # FPM rewrites its process title, so match on that rather than the binary name.
      test: ["CMD-SHELL", "pgrep -f 'php-fpm: master' > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # nginx needs the static files in public/ at the same path the app container
      # has them, so SCRIPT_FILENAME lines up. Read-only: nothing writes there.
      - ./public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # The health route Laravel ships. Same URL the smoke check hits.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  storage:
